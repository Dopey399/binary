name: Build Cre8torCut Android Host

on:
  push:
    branches:
      - cre8torcut-android-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact Cre8torCut v0.7.0 assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/assets
          cp android-build/source-current-v070-assets.tar.gz /tmp/cre8torcut-v070-assets.tar.gz
          echo '5b10e37cc2868d60ac94bf35bff9c01c7cfcd40e3d211336261d2c915edb03ee  /tmp/cre8torcut-v070-assets.tar.gz' | sha256sum -c -
          tar -xzf /tmp/cre8torcut-v070-assets.tar.gz -C android-build/app/src/main/assets
          cat > /tmp/cre8torcut-assets.sha256 <<'SUMS'
          a5c6c94bd59890bb94208c9eed401882416c81477e7072b10a8d63f06372e3a5  android-build/app/src/main/assets/index.html
          ea82cfd85d6840dbf0adf1754759db0059f5404958babfec383c7149f718534c  android-build/app/src/main/assets/styles.css
          e2cea053f9d8199a2293557e48c1e85f2532f43e97a8bf554a5a7f1912bde83e  android-build/app/src/main/assets/editor-core.js
          3579a7febf94c7221e4aedcfb7bb1073e9d5e1929893071711e8c6cfc7426767  android-build/app/src/main/assets/app.js
          SUMS
          sed -i 's/^          //' /tmp/cre8torcut-assets.sha256
          sha256sum -c /tmp/cre8torcut-assets.sha256
          node --check android-build/app/src/main/assets/app.js
          node --check android-build/app/src/main/assets/editor-core.js
          node - <<'JS'
          const Core = require('./android-build/app/src/main/assets/editor-core.js');
          const ok = (v,m) => { if (!v) throw new Error(m); };
          let p = Core.createProject('creator-mode-gate');
          ok(p.schemaVersion === 3, 'schema v3 missing');
          ok(Core.getVideoTracks(p).length === 3, 'three video tracks missing');
          const history = new Core.ProjectHistory(p);
          ok(Array.isArray(history.current().assets), 'clean startup/history failed');
          const add = Core.addAsset(p,{name:'x.mp4',type:'video/mp4',duration:10,width:1920,height:1080,size:1,lastModified:1}); p = add.project;
          const over = Core.appendClip(p, add.assetId, {timelineStart:2, layer:{opacity:0,scale:52,x:0,y:50,blendMode:'screen'}}, 'video_2'); p = over.project;
          const clip = Core.getTrack(p,'video_2').clips[0];
          ok(clip.layer.opacity === 0 && clip.layer.x === 0, 'layer zero-values failed');
          ok(Core.findClipsAtTime(p,2.5).length === 2, 'simultaneous layers failed');
          p = Core.moveClipToTrack(p, clip.id, 'video_3', 3);
          ok(Core.getTrack(p,'video_3').clips.length === 1, 'layer move failed');
          const q = Core.parseProject(Core.serializeProject(p));
          ok(q.schemaVersion === 3 && Core.getVideoTracks(q).length === 3, 'schema roundtrip failed');
          console.log('v0.7.0 core/layer gate: PASS');
          JS
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path('android-build/app/src/main/assets')
          css = (root/'styles.css').read_text()
          html = (root/'index.html').read_text()
          app = (root/'app.js').read_text()
          core = (root/'editor-core.js').read_text()
          assert '\\n' not in css, 'literal escaped-newline sequence found in CSS'
          assert 'v0.7.0 Creator Mode + hover-wheel precision + stronger creator identity' in css
          assert 'v0.7.0' in html
          for marker in ['id="creatorModeBtn"','data-tool="creator"','id="creatorRecipeGrid"','id="creatorStrength"','id="beforeAfterBtn"','data-mobile-tool="creator"']:
              assert marker in html, marker
          ids = re.findall(r'id="([^"]+)"', html)
          assert len(ids) == len(set(ids)), 'duplicate HTML ids'
          dom_refs = set(re.findall(r"\$\('([^']+)'\)", app))
          assert not (dom_refs - set(ids)), f'missing DOM ids: {sorted(dom_refs-set(ids))}'
          styles = re.findall(r"\{ id: '([^']+)', label: '([^']+)'", app.split('const TEXT_STYLE_PRESETS = [',1)[1].split('];',1)[0])
          animations = re.findall(r"\{ id: '([^']+)', label: '([^']+)'", app.split('const TEXT_ANIMATION_PRESETS = [',1)[1].split('];',1)[0])
          effects_block = app.split('const EFFECT_PRESETS = [',1)[1].split('];',1)[0]
          effects = re.findall(r"\{ id: '([^']+)', label: '([^']+)'", effects_block)
          recipes_block = app.split('const CREATOR_RECIPES = [',1)[1].split('];',1)[0]
          recipes = re.findall(r"\{ id: '([^']+)', label: '([^']+)'", recipes_block)
          assert len(styles) == 50 and len({x[0] for x in styles}) == 50
          assert len(animations) == 24 and len({x[0] for x in animations}) == 24
          assert len(effects) == 53 and len({x[0] for x in effects}) == 53 and effects[0][0] == 'none'
          assert effects_block.count('target: true') == 10
          assert len(recipes) == 11 and len({x[0] for x in recipes}) == 11
          for marker in ['handleHoverWheel','wheelGestureBaseProject','finalizeWheelHistoryGesture','applyCreatorRecipe','buildCreatorRecipes','originalComparisonClip','previewOriginalMode']:
              assert marker in app, marker
          assert 'aMAZEd' not in html and 'aMAZEd' not in app and 'aMAZEd' not in css, 'game-specific branding leaked into general Cre8torCut source'
          for marker in ['const SCHEMA_VERSION = 3','function moveClipToTrack','function setTrackState','function findClipsAtTime']:
              assert marker in core, marker
          print('v0.7.0 static regression gates: PASS')
          print('Creator recipes: PASS (11); wheel precision markers: PASS; before/after: PASS')
          print('Text styles: PASS (50); animations: PASS (24); video FX: PASS (52 + None; 10 sphere FX)')
          PY
          grep -q 'WindowInsets.Type.navigationBars()' android-build/app/src/main/java/com/cre8torcut/mobile/MainActivity.java
          grep -q 'BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE' android-build/app/src/main/java/com/cre8torcut/mobile/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build final signed APK
        working-directory: android-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Android package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='android-build/app/build/outputs/apk/debug/app-debug.apk'
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          python3 - <<'PY'
          from pathlib import Path
          apk = Path('android-build/app/build/outputs/apk/debug/app-debug.apk')
          if b'APK Sig Block 42' not in apk.read_bytes():
              raise SystemExit('missing APK Signature Scheme block')
          print('APK modern signature block: PASS')
          PY
          rm -rf /tmp/apk-assets && mkdir -p /tmp/apk-assets
          unzip -qq "$APK" 'assets/*' -d /tmp/apk-assets
          cat > /tmp/final-assets.sha256 <<'SUMS'
          a5c6c94bd59890bb94208c9eed401882416c81477e7072b10a8d63f06372e3a5  /tmp/apk-assets/assets/index.html
          ea82cfd85d6840dbf0adf1754759db0059f5404958babfec383c7149f718534c  /tmp/apk-assets/assets/styles.css
          e2cea053f9d8199a2293557e48c1e85f2532f43e97a8bf554a5a7f1912bde83e  /tmp/apk-assets/assets/editor-core.js
          3579a7febf94c7221e4aedcfb7bb1073e9d5e1929893071711e8c6cfc7426767  /tmp/apk-assets/assets/app.js
          SUMS
          sed -i 's/^          //' /tmp/final-assets.sha256
          sha256sum -c /tmp/final-assets.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cre8torcut-v0.7.0-creator-mode-wheel-precision
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
