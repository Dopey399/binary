name: Build Cre8torCut Android Host

on:
  push:
    branches:
      - cre8torcut-android-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact Cre8torCut v0.2.8 assets
        shell: bash
        run: |
          set -euo pipefail
          cat \
            android-build/source-assets/v028_0.b64 \
            android-build/source-assets/v028_1.b64 \
            android-build/source-assets/v028_2.b64 \
            android-build/source-assets/v028_3.b64 \
            > /tmp/cre8torcut-assets.tgz.b64
          base64 -d /tmp/cre8torcut-assets.tgz.b64 > /tmp/cre8torcut-assets.tgz
          echo '456a97ec63ebf841da305ccdccf3b51d52a33ad54e56f140fbb726bebc366d8a  /tmp/cre8torcut-assets.tgz' | sha256sum -c -
          rm -rf android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/assets
          tar -xzf /tmp/cre8torcut-assets.tgz -C android-build/app/src/main/assets
          cat > /tmp/cre8torcut-assets.sha256 <<'SUMS'
          cb4f1767b562c48c6876d4f1e9a09a22976ce46b555b22bf81eed47a8b16e0f6  android-build/app/src/main/assets/index.html
          cc700e6bf8d4c4313b8ece6d008868d94743daa06447c5ba4389f9b5d3e0e7f6  android-build/app/src/main/assets/styles.css
          5b71abe7e077300d2debed34601267bf372750e68e1263f54700004aaaa89601  android-build/app/src/main/assets/editor-core.js
          b58d26757e14babc56c63f04e68e813e537e21da8cca50749ac038744bb00a0f  android-build/app/src/main/assets/app.js
          SUMS
          sed -i 's/^          //' /tmp/cre8torcut-assets.sha256
          sha256sum -c /tmp/cre8torcut-assets.sha256
          node --check android-build/app/src/main/assets/app.js
          node --check android-build/app/src/main/assets/editor-core.js
          grep -q 'id="mobileDock"' android-build/app/src/main/assets/index.html
          grep -q 'data-mobile-sheet="project"' android-build/app/src/main/assets/index.html
          grep -q 'grid-template-columns: repeat(7' android-build/app/src/main/assets/styles.css
          grep -q 'function openMobileProject' android-build/app/src/main/assets/app.js
          grep -q 'id="textStyleBtn"' android-build/app/src/main/assets/index.html
          grep -q 'id="textZ"' android-build/app/src/main/assets/index.html
          grep -q "style: 'clean-bold'" android-build/app/src/main/assets/editor-core.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('android-build/app/src/main/assets/app.js').read_text()
          styles = re.findall(r"\{ id: '([^']+)', label: '([^']+)'", text)
          assert len(styles) == 50, f'expected 50 text styles, found {len(styles)}'
          assert len({sid for sid, _ in styles}) == 50, 'duplicate style ids'
          print('Text style preset count: PASS (50)')
          PY
          grep -q 'WindowInsets.Type.navigationBars()' android-build/app/src/main/java/com/cre8torcut/mobile/MainActivity.java
          grep -q 'BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE' android-build/app/src/main/java/com/cre8torcut/mobile/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build final signed APK
        working-directory: android-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Android package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='android-build/app/build/outputs/apk/debug/app-debug.apk'
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          python3 - <<'PY'
          from pathlib import Path
          apk = Path('android-build/app/build/outputs/apk/debug/app-debug.apk')
          if b'APK Sig Block 42' not in apk.read_bytes():
              raise SystemExit('missing APK Signature Scheme block')
          print('APK modern signature block: PASS')
          PY
          rm -rf /tmp/apk-assets && mkdir -p /tmp/apk-assets
          unzip -qq "$APK" 'assets/*' -d /tmp/apk-assets
          cat > /tmp/final-assets.sha256 <<'SUMS'
          cb4f1767b562c48c6876d4f1e9a09a22976ce46b555b22bf81eed47a8b16e0f6  /tmp/apk-assets/assets/index.html
          cc700e6bf8d4c4313b8ece6d008868d94743daa06447c5ba4389f9b5d3e0e7f6  /tmp/apk-assets/assets/styles.css
          5b71abe7e077300d2debed34601267bf372750e68e1263f54700004aaaa89601  /tmp/apk-assets/assets/editor-core.js
          b58d26757e14babc56c63f04e68e813e537e21da8cca50749ac038744bb00a0f  /tmp/apk-assets/assets/app.js
          SUMS
          sed -i 's/^          //' /tmp/final-assets.sha256
          sha256sum -c /tmp/final-assets.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cre8torcut-v0.2.8-text-styles
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
