name: Build Cre8torCut Android Host

on:
  push:
    branches:
      - cre8torcut-android-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact Cre8torCut v0.2.6 assets
        shell: bash
        run: |
          set -euo pipefail
          cat android-build/source-assets/part*.b64 > /tmp/cre8torcut-assets.tgz.b64
          base64 -d /tmp/cre8torcut-assets.tgz.b64 > /tmp/cre8torcut-assets.tgz
          echo '7900543a47e413155bdf06c1c497434b101b139fe8c9d7ed9a727b3f78853786  /tmp/cre8torcut-assets.tgz' | sha256sum -c -
          rm -rf android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/assets
          tar -xzf /tmp/cre8torcut-assets.tgz -C android-build/app/src/main/assets
          cat > /tmp/cre8torcut-assets.sha256 <<'SUMS'
          45003fcfdbf5aa8e50fe25a2a5478b04feaa1858820140f478343fc4425197a5  android-build/app/src/main/assets/index.html
          5677c84c3b3230d8e615186c3739c820a399c74c5e97be65522e70b7d256045f  android-build/app/src/main/assets/styles.css
          bffcda9ff510c9eef2a9611c09c0650557c19635a15616b53d4b50db9c0780c2  android-build/app/src/main/assets/editor-core.js
          0e37afba08ad9c15dcade5778935680e09603a650afe668048694b998e9228c4  android-build/app/src/main/assets/app.js
          SUMS
          sed -i 's/^          //' /tmp/cre8torcut-assets.sha256
          sha256sum -c /tmp/cre8torcut-assets.sha256
          node --check android-build/app/src/main/assets/app.js
          node --check android-build/app/src/main/assets/editor-core.js
          grep -q 'id="mobileDock"' android-build/app/src/main/assets/index.html
          grep -q 'grid-template-areas: "topbar" "project" "viewer" "timeline" "dock"' android-build/app/src/main/assets/styles.css
          grep -q 'function openMobileTool' android-build/app/src/main/assets/app.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build final signed APK
        working-directory: android-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Android package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='android-build/app/build/outputs/apk/debug/app-debug.apk'
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          python3 - <<'PY'
          from pathlib import Path
          apk = Path('android-build/app/build/outputs/apk/debug/app-debug.apk')
          data = apk.read_bytes()
          if b'APK Sig Block 42' not in data:
              raise SystemExit('missing APK Signature Scheme block')
          print('APK modern signature block: PASS')
          PY
          rm -rf /tmp/apk-assets && mkdir -p /tmp/apk-assets
          unzip -qq "$APK" 'assets/*' -d /tmp/apk-assets
          cat > /tmp/final-assets.sha256 <<'SUMS'
          45003fcfdbf5aa8e50fe25a2a5478b04feaa1858820140f478343fc4425197a5  /tmp/apk-assets/assets/index.html
          5677c84c3b3230d8e615186c3739c820a399c74c5e97be65522e70b7d256045f  /tmp/apk-assets/assets/styles.css
          bffcda9ff510c9eef2a9611c09c0650557c19635a15616b53d4b50db9c0780c2  /tmp/apk-assets/assets/editor-core.js
          0e37afba08ad9c15dcade5778935680e09603a650afe668048694b998e9228c4  /tmp/apk-assets/assets/app.js
          SUMS
          sed -i 's/^          //' /tmp/final-assets.sha256
          sha256sum -c /tmp/final-assets.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cre8torcut-v0.2.6-mobile-workspace
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
