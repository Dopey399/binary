name: Build Cre8torCut Android Host

on:
  push:
    branches:
      - cre8torcut-android-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact Cre8torCut v0.2.10 assets
        shell: bash
        run: |
          set -euo pipefail
          base64 -d android-build/source-assets/v0210.b64 > /tmp/cre8torcut-v0210.tar.xz
          echo '3c7ab96b48d8f5160d80e8d0578419adbc19b5e9251da4f33e68167ae5077cfa  /tmp/cre8torcut-v0210.tar.xz' | sha256sum -c -
          rm -rf android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/assets
          xz -dc /tmp/cre8torcut-v0210.tar.xz | tar -xf - -C android-build/app/src/main/assets
          cat > /tmp/cre8torcut-assets.sha256 <<'SUMS'
          eedd7eed74234b759b9246938339c29f3f7056ceffde78aae2a9fe43300ad88b  android-build/app/src/main/assets/index.html
          eeee655431a09f3016ef1c2e0511c74f06381c8ff1d9924a8271961ce868e03c  android-build/app/src/main/assets/styles.css
          dc48459874db2db39b08ec136c4f7c3c96f4718c570499c311d0fb9c5ae6685f  android-build/app/src/main/assets/editor-core.js
          3a6d07e409b273ce234003efe980fcce52127bf8962ddf46f70822c7a936fae6  android-build/app/src/main/assets/app.js
          SUMS
          sed -i 's/^          //' /tmp/cre8torcut-assets.sha256
          sha256sum -c /tmp/cre8torcut-assets.sha256
          node --check android-build/app/src/main/assets/app.js
          node --check android-build/app/src/main/assets/editor-core.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          css = Path('android-build/app/src/main/assets/styles.css').read_text()
          assert '\\n' not in css, 'literal escaped-newline sequence found in CSS'
          assert 'v0.2.7 mobile cinema workspace' in css, 'cinema mobile CSS marker missing'
          assert 'grid-template-areas: "topbar" "viewer" "timeline" "dock"' in css, 'cinema mobile grid missing'
          assert '.top-actions > * { display: none !important; }' in css, 'compact mobile topbar rule missing'
          assert '.project-strip, .media-panel, .inspector {' in css, 'mobile sheet rule missing'
          text = Path('android-build/app/src/main/assets/app.js').read_text()
          styles_block = text.split('const TEXT_STYLE_PRESETS = [',1)[1].split('];',1)[0]
          styles = re.findall(r"\{ id: '([^']+)', label: '([^']+)'", styles_block)
          assert len(styles) == 50, f'expected 50 text styles, found {len(styles)}'
          assert len({sid for sid, _ in styles}) == 50, 'duplicate style ids'
          animations_block = text.split('const TEXT_ANIMATION_PRESETS = [',1)[1].split('];',1)[0]
          animations = re.findall(r"\{ id: '([^']+)', label: '([^']+)'", animations_block)
          assert len(animations) == 24, f'expected 24 text animations, found {len(animations)}'
          assert len({aid for aid, _ in animations}) == 24, 'duplicate animation ids'
          assert 'drawFrame(exportedTime);' in text, 'animated export marker missing'
          html = Path('android-build/app/src/main/assets/index.html').read_text()
          assert 'v0.2.10' in html, 'v0.2.10 UI marker missing'
          assert 'id="mobileDock"' in html
          assert 'id="textStyleFeatured"' in html
          assert 'id="textAnimationFeatured"' in html
          print('CSS escaped-newline regression gate: PASS')
          print('Cinema mobile workspace markers: PASS')
          print('Text style preset count: PASS (50)')
          print('Text animation preset count: PASS (24)')
          PY
          grep -q 'WindowInsets.Type.navigationBars()' android-build/app/src/main/java/com/cre8torcut/mobile/MainActivity.java
          grep -q 'BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE' android-build/app/src/main/java/com/cre8torcut/mobile/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build final signed APK
        working-directory: android-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Android package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='android-build/app/build/outputs/apk/debug/app-debug.apk'
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          python3 - <<'PY'
          from pathlib import Path
          apk = Path('android-build/app/build/outputs/apk/debug/app-debug.apk')
          if b'APK Sig Block 42' not in apk.read_bytes():
              raise SystemExit('missing APK Signature Scheme block')
          print('APK modern signature block: PASS')
          PY
          rm -rf /tmp/apk-assets && mkdir -p /tmp/apk-assets
          unzip -qq "$APK" 'assets/*' -d /tmp/apk-assets
          cat > /tmp/final-assets.sha256 <<'SUMS'
          eedd7eed74234b759b9246938339c29f3f7056ceffde78aae2a9fe43300ad88b  /tmp/apk-assets/assets/index.html
          eeee655431a09f3016ef1c2e0511c74f06381c8ff1d9924a8271961ce868e03c  /tmp/apk-assets/assets/styles.css
          dc48459874db2db39b08ec136c4f7c3c96f4718c570499c311d0fb9c5ae6685f  /tmp/apk-assets/assets/editor-core.js
          3a6d07e409b273ce234003efe980fcce52127bf8962ddf46f70822c7a936fae6  /tmp/apk-assets/assets/app.js
          SUMS
          sed -i 's/^          //' /tmp/final-assets.sha256
          sha256sum -c /tmp/final-assets.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cre8torcut-v0.2.10-mobile-layout-repair
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
