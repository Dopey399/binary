name: Build Cre8torCut Android Host

on:
  push:
    branches:
      - cre8torcut-android-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact Cre8torCut v0.2.7 assets
        shell: bash
        run: |
          set -euo pipefail
          cat \
            android-build/source-assets/part00.b64 \
            android-build/source-assets/part01.b64 \
            android-build/source-assets/part02a.b64 \
            android-build/source-assets/part02b.b64 \
            android-build/source-assets/part02c.b64 \
            android-build/source-assets/part03.b64 \
            android-build/source-assets/part04.b64 \
            > /tmp/cre8torcut-assets.tgz.b64
          base64 -d /tmp/cre8torcut-assets.tgz.b64 > /tmp/cre8torcut-assets.tgz
          echo 'f79da4364ec4cffb091fd6ac35c205d6f009bb34d2566c00ae019829377ea78f  /tmp/cre8torcut-assets.tgz' | sha256sum -c -
          rm -rf android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/assets
          tar -xzf /tmp/cre8torcut-assets.tgz -C android-build/app/src/main/assets
          cat > /tmp/cre8torcut-assets.sha256 <<'SUMS'
          5cb41efc3368b537578e16616260c048f87afe3f20a4e0db62f42f45f0cd5a7a  android-build/app/src/main/assets/index.html
          ab315e4a08c7ba11ac5e76c22a74acf40392d763ba37686b4f046753f7e8b76a  android-build/app/src/main/assets/styles.css
          bffcda9ff510c9eef2a9611c09c0650557c19635a15616b53d4b50db9c0780c2  android-build/app/src/main/assets/editor-core.js
          deeefb4ad94c309be39b32ab5e15089b51da49e737f6d118b54deef65868bf43  android-build/app/src/main/assets/app.js
          SUMS
          sed -i 's/^          //' /tmp/cre8torcut-assets.sha256
          sha256sum -c /tmp/cre8torcut-assets.sha256
          node --check android-build/app/src/main/assets/app.js
          node --check android-build/app/src/main/assets/editor-core.js
          grep -q 'id="mobileDock"' android-build/app/src/main/assets/index.html
          grep -q 'data-mobile-sheet="project"' android-build/app/src/main/assets/index.html
          grep -q 'grid-template-columns: repeat(7' android-build/app/src/main/assets/styles.css
          grep -q 'function openMobileProject' android-build/app/src/main/assets/app.js
          grep -q 'WindowInsets.Type.navigationBars()' android-build/app/src/main/java/com/cre8torcut/mobile/MainActivity.java
          grep -q 'BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE' android-build/app/src/main/java/com/cre8torcut/mobile/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build final signed APK
        working-directory: android-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Android package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='android-build/app/build/outputs/apk/debug/app-debug.apk'
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          python3 - <<'PY'
          from pathlib import Path
          apk = Path('android-build/app/build/outputs/apk/debug/app-debug.apk')
          if b'APK Sig Block 42' not in apk.read_bytes():
              raise SystemExit('missing APK Signature Scheme block')
          print('APK modern signature block: PASS')
          PY
          rm -rf /tmp/apk-assets && mkdir -p /tmp/apk-assets
          unzip -qq "$APK" 'assets/*' -d /tmp/apk-assets
          cat > /tmp/final-assets.sha256 <<'SUMS'
          5cb41efc3368b537578e16616260c048f87afe3f20a4e0db62f42f45f0cd5a7a  /tmp/apk-assets/assets/index.html
          ab315e4a08c7ba11ac5e76c22a74acf40392d763ba37686b4f046753f7e8b76a  /tmp/apk-assets/assets/styles.css
          bffcda9ff510c9eef2a9611c09c0650557c19635a15616b53d4b50db9c0780c2  /tmp/apk-assets/assets/editor-core.js
          deeefb4ad94c309be39b32ab5e15089b51da49e737f6d118b54deef65868bf43  /tmp/apk-assets/assets/app.js
          SUMS
          sed -i 's/^          //' /tmp/final-assets.sha256
          sha256sum -c /tmp/final-assets.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cre8torcut-v0.2.7-cinema-immersive
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
