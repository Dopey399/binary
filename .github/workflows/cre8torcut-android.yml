name: Build Cre8torCut Android Host

on:
  push:
    branches:
      - cre8torcut-android-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact Cre8torCut v0.5.0 assets
        shell: bash
        run: |
          set -euo pipefail
          cat \
            android-build/source-assets/v0210_0.b64 \
            android-build/source-assets/v0210_1.b64 \
            android-build/source-assets/v0210_2.b64 \
            android-build/source-assets/v0210_3.b64 \
            android-build/source-assets/v0210_4.b64 \
            android-build/source-assets/v0210_5.b64 \
            > /tmp/cre8torcut-v0210.tar.xz.b64
          base64 -d /tmp/cre8torcut-v0210.tar.xz.b64 > /tmp/cre8torcut-v0210.tar.xz
          echo '3c7ab96b48d8f5160d80e8d0578419adbc19b5e9251da4f33e68167ae5077cfa  /tmp/cre8torcut-v0210.tar.xz' | sha256sum -c -
          rm -rf android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/assets
          xz -dc /tmp/cre8torcut-v0210.tar.xz | tar -xf - -C android-build/app/src/main/assets
          python3 - <<'PYHTML'
          from pathlib import Path
          p = Path('android-build/app/src/main/assets/index.html')
          text = p.read_text()
          old_footer = 'v0.2.10 restores the intended cinema mobile workspace and keeps 50 text styles, 24 animated-text presets, and the deterministic project model with per-clip edits, undo/redo, project JSON save/load, sequential multi-clip playback, and WebM export. MP4/H.264 is not implemented yet.'
          new_footer = 'v0.3.0 introduces the professional adaptive Studio workspace in landscape while preserving the repaired portrait cinema editor, 50 text styles, 24 animated-text presets, deterministic project edits, undo/redo, project JSON save/load, sequential playback, and WebM export. MP4/H.264 is not implemented yet.'
          assert old_footer in text
          text = text.replace('<span class="version">v0.2.10</span>', '<span class="version">v0.3.0</span>', 1)
          text = text.replace(old_footer, new_footer, 1)
          p.write_text(text)
          PYHTML
          cat android-build/source-overrides-v030/studio-0.css android-build/source-overrides-v030/studio-1.css >> android-build/app/src/main/assets/styles.css
          cat \
            android-build/source-overrides-v040/v040_patch_0.txt \
            android-build/source-overrides-v040/v040_patch_1.txt \
            android-build/source-overrides-v040/v040_patch_2.txt \
            android-build/source-overrides-v040/v040_patch_3.txt \
            android-build/source-overrides-v040/v040_patch_4.txt \
            android-build/source-overrides-v040/v040_patch_5.txt \
            android-build/source-overrides-v040/v040_patch_6.txt \
            > /tmp/v040.patch
          patch -p1 < /tmp/v040.patch
          cat \
            android-build/source-overrides-v050/v050_patch_0.txt \
            android-build/source-overrides-v050/v050_patch_1.txt \
            android-build/source-overrides-v050/v050_patch_2.txt \
            android-build/source-overrides-v050/v050_patch_3.txt \
            android-build/source-overrides-v050/v050_patch_4.txt \
            > /tmp/v050.patch
          patch -p1 < /tmp/v050.patch
          cat > /tmp/cre8torcut-assets.sha256 <<'SUMS'
          13db7162c74911d3daa93fae547834584eceb868c0c8d884f73254d4781c7044  android-build/app/src/main/assets/index.html
          cf98bca26bd7b1ec6482045a6bc729facba8b16d8fefc409d8d2c5296a6af286  android-build/app/src/main/assets/styles.css
          d1948730f46efe087f8f9fbfa16a08c9868d1372fb8c0ce6a9a35bcab01fd563  android-build/app/src/main/assets/editor-core.js
          8ae1c69c20d4254eefd1af942680f8ea85e77e563f14fbf802853e534a9f6d47  android-build/app/src/main/assets/app.js
          SUMS
          sed -i 's/^          //' /tmp/cre8torcut-assets.sha256
          sha256sum -c /tmp/cre8torcut-assets.sha256
          node --check android-build/app/src/main/assets/app.js
          node --check android-build/app/src/main/assets/editor-core.js
          node - <<'JS'
          const Core = require('./android-build/app/src/main/assets/editor-core.js');
          let p = Core.createProject('fx-gate');
          p = Core.addAsset(p,{name:'x.mp4',type:'video/mp4',duration:10,width:1920,height:1080,size:1,lastModified:1}).project;
          let c = Core.getVideoTrack(p).clips[0];
          p = Core.updateClip(p,c.id,{effects:{preset:'sphere-glow',intensity:175,speed:250,blend:75,targetX:22.5,targetY:44.5,targetSize:18,targetColor:'#12abef',targetTrack:true}});
          const q = Core.parseProject(Core.serializeProject(p));
          const e = Core.getVideoTrack(q).clips[0].effects;
          if (e.preset !== 'sphere-glow' || e.intensity !== 175 || e.speed !== 250 || e.blend !== 75 || e.targetTrack !== true || e.targetColor !== '#12abef') throw new Error('FX schema roundtrip failed');
          console.log('FX schema roundtrip: PASS');
          JS
          python3 - <<'PY'
          import re
          from pathlib import Path
          css = Path('android-build/app/src/main/assets/styles.css').read_text()
          html = Path('android-build/app/src/main/assets/index.html').read_text()
          app = Path('android-build/app/src/main/assets/app.js').read_text()
          assert '\\n' not in css, 'literal escaped-newline sequence found in CSS'
          assert 'v0.4.0 Cutroom mobile UI' in css
          assert 'v0.5.0 one-tap video effects + sphere-target racing FX' in css
          assert 'v0.5.0' in html
          assert 'data-mobile-tool="effects"' in html
          assert 'id="effectLibrary"' in html
          assert 'id="pickSphereBtn"' in html
          ids = re.findall(r'id="([^"]+)"', html)
          assert len(ids) == len(set(ids)), 'duplicate HTML ids'
          styles_block = app.split('const TEXT_STYLE_PRESETS = [',1)[1].split('];',1)[0]
          styles = re.findall(r"\{ id: '([^']+)', label: '([^']+)'", styles_block)
          assert len(styles) == 50 and len({sid for sid, _ in styles}) == 50
          animations_block = app.split('const TEXT_ANIMATION_PRESETS = [',1)[1].split('];',1)[0]
          animations = re.findall(r"\{ id: '([^']+)', label: '([^']+)'", animations_block)
          assert len(animations) == 24 and len({aid for aid, _ in animations}) == 24
          effects_block = app.split('const EFFECT_PRESETS = [',1)[1].split('];',1)[0]
          effects = re.findall(r"\{ id: '([^']+)', label: '([^']+)'", effects_block)
          assert len(effects) == 53 and len({eid for eid, _ in effects}) == 53
          assert effects[0][0] == 'none'
          assert effects_block.count('target: true') == 10
          assert 'sphereTargetForFrame' in app
          assert 'ctx.getImageData' in app
          assert 'drawVideoEffectOverlay(clip, g, renderProjectTime);' in app
          assert 'drawFrame(exportedTime);' in app
          print('v0.5.0 FX regression gates: PASS')
          print('Text styles: PASS (50)')
          print('Text animations: PASS (24)')
          print('Video FX: PASS (52 effects + None; 10 sphere-target presets)')
          PY
          grep -q 'WindowInsets.Type.navigationBars()' android-build/app/src/main/java/com/cre8torcut/mobile/MainActivity.java
          grep -q 'BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE' android-build/app/src/main/java/com/cre8torcut/mobile/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build final signed APK
        working-directory: android-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Android package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='android-build/app/build/outputs/apk/debug/app-debug.apk'
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          python3 - <<'PY'
          from pathlib import Path
          apk = Path('android-build/app/build/outputs/apk/debug/app-debug.apk')
          if b'APK Sig Block 42' not in apk.read_bytes():
              raise SystemExit('missing APK Signature Scheme block')
          print('APK modern signature block: PASS')
          PY
          rm -rf /tmp/apk-assets && mkdir -p /tmp/apk-assets
          unzip -qq "$APK" 'assets/*' -d /tmp/apk-assets
          cat > /tmp/final-assets.sha256 <<'SUMS'
          13db7162c74911d3daa93fae547834584eceb868c0c8d884f73254d4781c7044  /tmp/apk-assets/assets/index.html
          cf98bca26bd7b1ec6482045a6bc729facba8b16d8fefc409d8d2c5296a6af286  /tmp/apk-assets/assets/styles.css
          d1948730f46efe087f8f9fbfa16a08c9868d1372fb8c0ce6a9a35bcab01fd563  /tmp/apk-assets/assets/editor-core.js
          8ae1c69c20d4254eefd1af942680f8ea85e77e563f14fbf802853e534a9f6d47  /tmp/apk-assets/assets/app.js
          SUMS
          sed -i 's/^          //' /tmp/final-assets.sha256
          sha256sum -c /tmp/final-assets.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cre8torcut-v0.5.0-fx-sphere-pack
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
