name: Build Cre8torCut Android Host

on:
  push:
    branches:
      - cre8torcut-android-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Emulator startup diagnostic
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            adb install -r android-build/app/build/outputs/apk/debug/app-debug.apk
            INSTALL_RC=$?
            adb logcat -c
            adb shell am force-stop com.cre8torcut.mobile
            adb shell am start -n com.cre8torcut.mobile/.MainActivity
            START_RC=$?
            sleep 20
            PID="$(adb shell pidof com.cre8torcut.mobile | tr -d '\r')"
            echo "INSTALL_RC=$INSTALL_RC" | tee cre8torcut-diagnostic.txt
            echo "START_RC=$START_RC" | tee -a cre8torcut-diagnostic.txt
            echo "PID=$PID" | tee -a cre8torcut-diagnostic.txt
            echo "--- activity ---" | tee -a cre8torcut-diagnostic.txt
            adb shell dumpsys activity activities | grep -C 8 'com.cre8torcut.mobile' | tee -a cre8torcut-diagnostic.txt || true
            echo "--- crash log ---" | tee -a cre8torcut-diagnostic.txt
            adb logcat -d -v threadtime > cre8torcut-logcat-full.txt
            grep -E -C 40 'FATAL EXCEPTION|AndroidRuntime|Process: com.cre8torcut.mobile|com.cre8torcut.mobile' cre8torcut-logcat-full.txt | tee -a cre8torcut-diagnostic.txt || true
            adb exec-out screencap -p > cre8torcut-smoke.png || true
            if grep -qE 'FATAL EXCEPTION.*|Process: com.cre8torcut.mobile' cre8torcut-logcat-full.txt; then
              echo 'APP_FATAL_CRASH=1' | tee -a cre8torcut-diagnostic.txt
              exit 2
            fi
            if [ "$INSTALL_RC" -ne 0 ] || [ "$START_RC" -ne 0 ] || [ -z "$PID" ]; then
              echo 'APP_ALIVE=0' | tee -a cre8torcut-diagnostic.txt
              exit 3
            fi
            echo 'APP_ALIVE=1' | tee -a cre8torcut-diagnostic.txt

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cre8torcut-clean-host
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cre8torcut-startup-diagnostic
          path: |
            cre8torcut-diagnostic.txt
            cre8torcut-logcat-full.txt
            cre8torcut-smoke.png
          if-no-files-found: warn
