name: Build Cre8torCut v0.8.0 Transparency Layers

on:
  push:
    branches:
      - cre8torcut-android-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact authoritative v0.8.0 web assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/assets
          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-39d8-81f4-aa2e-718b7dab196a/raw?se=2026-10-13T15%3A50%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=7666b840-a491-5f2d-91f7-5466c74922a0&skoid=db055408-822b-485f-92f8-bfeb3ea92408&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T13%3A53%3A41Z&ske=2026-10-14T13%3A53%3A41Z&sks=b&skv=2026-02-06&sig=Tae0y7exBowW4Z3NmRdkS3J4lN2pGSX%2Bm%2BnDJTS2nJY%3D' -o android-build/app/src/main/assets/index.html
          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-6454-81f4-9038-7d809df93474/raw?se=2026-10-13T15%3A50%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=0b9ad694-b887-5073-9ab9-c54fd8dfc2fb&skoid=db055408-822b-485f-92f8-bfeb3ea92408&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T13%3A16%3A10Z&ske=2026-10-14T13%3A16%3A10Z&sks=b&skv=2026-02-06&sig=xoKJ0X/5IdUJs2VJIMx50Ddir8eXtXdRlgopRkk8%2BtM%3D' -o android-build/app/src/main/assets/styles.css
          curl -fL --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-9b10-822f-8783-90b59035d9bf/raw?se=2026-10-13T15%3A50%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=9bcddf2c-3d0f-5f2e-b271-f412385cd79a&skoid=db055408-822b-485f-92f8-bfeb3ea92408&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T12%3A08%3A19Z&ske=2026-10-14T12%3A08%3A19Z&sks=b&skv=2026-02-06&sig=uEwH%2BrD7VxuQzRi3bPsarEp7kID5MoY%2B5RSscfFbP0A%3D' -o android-build/app/src/main/assets/editor-core.js
          curl -fL --retry 3 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-b378-81f8-81fc-f6c0415da25b/raw?se=2026-10-13T15%3A50%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=4f9e473b-507a-5bb1-adf1-dd3d68d8a268&skoid=db055408-822b-485f-92f8-bfeb3ea92408&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T12%3A08%3A21Z&ske=2026-10-14T12%3A08%3A21Z&sks=b&skv=2026-02-06&sig=RJZYVqUZQK/bSBo6AKgbjOVXDPNjG9/1EPoV89To8ME%3D' -o android-build/app/src/main/assets/app.js
          cat > /tmp/assets.sha256 <<'SUMS'
          3e1feaac8691da8829b702ace88f61babdd7e280df7f1fd1b9c199ce792edca3  android-build/app/src/main/assets/index.html
          98b260e79aaaca361237e14addeb05df8ced18ded9d50bb136d6cfe173ac62cc  android-build/app/src/main/assets/styles.css
          1f21f2be66fc8625ea36c0941f8c740d7267d637791d4f9318ab8885a54952ec  android-build/app/src/main/assets/editor-core.js
          0d61c05d0cdcbdf45365ae1a6c5dbd8132c89f746942e6e0c58d3cc25a1dd26e  android-build/app/src/main/assets/app.js
          SUMS
          sed -i 's/^          //' /tmp/assets.sha256
          sha256sum -c /tmp/assets.sha256
          node --check android-build/app/src/main/assets/app.js
          node --check android-build/app/src/main/assets/editor-core.js
          grep -q 'accept="video/\*,image/\*"' android-build/app/src/main/assets/index.html
          grep -q 'id="keyEnabled"' android-build/app/src/main/assets/index.html
          grep -q 'probeImageFile' android-build/app/src/main/assets/app.js
          grep -q 'colorKeyRenderer' android-build/app/src/main/assets/app.js
          grep -q 'keyEnabled: false' android-build/app/src/main/assets/editor-core.js
          node - <<'JS'
          const Core = require('./android-build/app/src/main/assets/editor-core.js');
          let p = Core.createProject('transparency-gate');
          const add = Core.addAsset(p,{name:'overlay.png',type:'image/png',duration:5,width:800,height:600,size:1,lastModified:1},{trackId:'video_2',clip:{timelineStart:1,effects:{keyEnabled:true,keyColor:'#00ff00',keyTolerance:27,keySoftness:19},layer:{opacity:82,scale:64,x:70,y:35,blendMode:'screen'}}});
          p = add.project;
          const q = Core.parseProject(Core.serializeProject(p));
          const clip = Core.findClipLocation(q, add.clipId).clip;
          if (!clip.effects.keyEnabled || clip.effects.keyTolerance !== 27 || clip.effects.keySoftness !== 19) throw new Error('transparency persistence failed');
          if (Core.getVideoTracks(q).length !== 3 || clip.layer.opacity !== 82 || clip.layer.blendMode !== 'screen') throw new Error('layer regression');
          console.log('transparency + three-layer gate: PASS');
          JS

      - name: Verify Android host and version
        shell: bash
        run: |
          set -euo pipefail
          HOST='android-build/app/src/main/java/com/cre8torcut/mobile/MainActivity.java'
          grep -q 'Intent.ACTION_GET_CONTENT' "$HOST"
          grep -q 'Intent.ACTION_OPEN_DOCUMENT' "$HOST"
          grep -q 'versionCode 18' android-build/app/build.gradle
          grep -q "versionName '0.8.0'" android-build/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        working-directory: android-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK and embedded exact source
        shell: bash
        run: |
          set -euo pipefail
          APK='android-build/app/build/outputs/apk/debug/app-debug.apk'
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          python3 - <<'PY'
          from pathlib import Path
          apk = Path('android-build/app/build/outputs/apk/debug/app-debug.apk')
          if b'APK Sig Block 42' not in apk.read_bytes(): raise SystemExit('missing modern APK signature block')
          print('APK modern signature block: PASS')
          PY
          rm -rf /tmp/apk-assets && mkdir -p /tmp/apk-assets
          unzip -qq "$APK" 'assets/*' -d /tmp/apk-assets
          sed 's#android-build/app/src/main/assets/#/tmp/apk-assets/assets/#' /tmp/assets.sha256 > /tmp/final-assets.sha256
          sha256sum -c /tmp/final-assets.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cre8torcut-v0.8.0-transparency-layers-vc18
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
