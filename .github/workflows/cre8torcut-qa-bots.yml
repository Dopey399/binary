name: Cre8torCut QA Bots

on:
  push:
    branches: [cre8torcut-android-build]
    paths:
      - 'qa/**'
      - 'android-build/app/**'
      - '.github/workflows/cre8torcut-qa-bots.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cre8torcut-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_CANDIDATE_ARTIFACT_ID: '11827753664'

jobs:
  source-truth-bot:
    name: source-truth-bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore v0.8.0 base and apply exact v0.9.0 source patch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash qa/scripts/restore-current-candidate.sh .
      - name: Report exact source identity
        run: sha256sum android-build/app/src/main/assets/{index.html,styles.css,editor-core.js,app.js}

  core-model-bot:
    name: core-model-bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore current candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash qa/scripts/restore-current-candidate.sh .
      - run: node qa/scripts/core-bot.mjs

  ui-contract-bot:
    name: ui-contract-bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore current candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash qa/scripts/restore-current-candidate.sh .
      - run: node qa/scripts/ui-contract-bot.mjs

  browser-bot:
    name: browser-bot / ${{ matrix.bot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bot: [desktop, buttons, mobile, media, chaos]
    steps:
      - uses: actions/checkout@v4
      - name: Restore current candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash qa/scripts/restore-current-candidate.sh .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA runner
        working-directory: qa
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: qa
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.bot }} bot
        working-directory: qa
        run: npm run test:${{ matrix.bot }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.bot }}-${{ github.run_id }}
          path: qa/artifacts
          if-no-files-found: ignore
          retention-days: 30

  android-host-bot:
    name: android-host-bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore current candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash qa/scripts/restore-current-candidate.sh .
      - run: bash qa/scripts/android-host-bot.sh .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        working-directory: android-build
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: qa-built-apk-${{ github.run_id }}
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  apk-package-bot:
    name: apk-package-bot
    needs: android-host-bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qa-built-apk-${{ github.run_id }}
          path: /tmp/qa-apk
      - name: Verify package, signature, and embedded v0.9.0 source
        shell: bash
        run: |
          set -euo pipefail
          APK='/tmp/qa-apk/app-debug.apk'
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          python3 - <<'PY'
          from pathlib import Path
          apk = Path('/tmp/qa-apk/app-debug.apk')
          if b'APK Sig Block 42' not in apk.read_bytes():
              raise SystemExit('missing modern APK signature block')
          print('modern APK signature block: PASS')
          PY
          rm -rf /tmp/apk-assets && mkdir -p /tmp/apk-assets
          unzip -qq "$APK" 'assets/*' -d /tmp/apk-assets
          cat > /tmp/assets.sha256 <<'SUMS'
          7da6aec3956fdbf7da008cc60c72a71c9b2a519da94361ff789eb624fc92aff0  /tmp/apk-assets/assets/index.html
          8e9a43f5120ef2bb69314c7d17804a778e4cc8015ca4031ad06ab47bbec4559e  /tmp/apk-assets/assets/styles.css
          72ecb368da5b4207b54538470938d70f30414ffbe227775eaf63d21f426b0d86  /tmp/apk-assets/assets/editor-core.js
          dba7bce86f9fdcf94a65441319520131ff5de512bec49c8216c8a3163a1a4deb  /tmp/apk-assets/assets/app.js
          SUMS
          sha256sum -c /tmp/assets.sha256
